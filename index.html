<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7e9f3"><link rel="manifest" href="./manifest.webmanifest"><title>铃音计划 · 双角色语音原型</title>
<style>:root{font-family:system-ui,sans-serif;color:#332b3e;background:#fff9fd}*{box-sizing:border-box}body{margin:0}.wrap{max-width:680px;margin:auto}header{padding:20px;background:linear-gradient(120deg,#fce5f1,#e7edff)}h1{font-size:21px;margin:0}small{color:#746b82}.characters{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}.char{border:2px solid #eee5f0;border-radius:20px;padding:16px;background:white;text-align:center;cursor:pointer;color:#332b3e}.char.active{border-color:#d778ac;background:#fff1f8}.face{font-size:54px}.char b{display:block}.char span{font-size:12px;color:#716878}.status{padding:0 18px 12px;color:#62556c;font-size:13px}.messages{height:42vh;min-height:270px;overflow-y:auto;padding:14px;background:#f8f5fa;border-radius:22px;margin:0 12px}.bubble{max-width:90%;background:white;border-radius:16px;padding:11px 13px;margin:9px 0;white-space:pre-wrap;line-height:1.55}.bubble.me{margin-left:auto;background:#e9d9ff}.who{display:block;font-size:11px;color:#786b82;margin-bottom:4px}.controls{padding:14px;display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:150px;padding:12px;border-radius:14px;border:1px solid #dcd2e2;font-size:16px}button{border:0;border-radius:14px;padding:12px 15px;background:#d97aac;color:white;font-weight:600}button.secondary{background:#7b84bd}button.ghost{background:#eee9f3;color:#574c63}.notice{padding:0 16px 22px;color:#746b82;font-size:12px;line-height:1.6}button:focus-visible,input:focus-visible{outline:3px solid #6147a8}</style></head>
<body><div class="wrap"><header><h1>🌸 铃音计划 <small>· 手机原型 v0.1</small></h1><small>双角色 · 本地聊天记录 · 浏览器语音</small></header><section class="characters"><button class="char active" id="suzune" aria-pressed="true"><div class="face">🌸</div><b>白濑铃音</b><span>活泼、亲切</span></button><button class="char" id="io" aria-pressed="false"><div class="face">❄️</div><b>星野伊绪</b><span>冷静、理性</span></button></section><div class="status" id="status">当前角色：铃音 · 演示回复模式</div><main class="messages" id="messages" aria-live="polite"></main><form class="controls" id="form"><input id="input" autocomplete="off" placeholder="给铃音或伊绪说句话…" aria-label="聊天内容"><button type="submit">发送</button><button type="button" class="secondary" id="mic">🎙️ 语音输入</button><button type="button" class="ghost" id="clear">清空</button></form><div class="notice">这是演示原型：回复为预设台词，并非 AI 生成。语音输入依赖浏览器支持及权限；语音朗读使用设备内置语音。聊天记录只存储在本设备浏览器中。请勿输入敏感信息。麦克风通常需要 HTTPS 或 localhost。</div></div>
<script>
const $=id=>document.getElementById(id),KEY='suzune-demo-v1';let selected='suzune',history=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))history=v.slice(-100)}catch{}const names={suzune:'🌸 铃音',io:'❄️ 伊绪',me:'哥哥'};function render(){const root=$('messages');root.replaceChildren();for(const item of history){const div=document.createElement('div');div.className='bubble'+(item.who==='me'?' me':'');const who=document.createElement('span');who.className='who';who.textContent=names[item.who]||item.who;div.append(who,document.createTextNode(item.text));root.append(div)}root.scrollTop=root.scrollHeight}function save(){history=history.slice(-100);try{localStorage.setItem(KEY,JSON.stringify(history))}catch{}render()}if(!history.length){history.push({who:'suzune',text:'哥哥，欢迎来到铃音计划！现在是演示模式，先试试聊天和语音吧。'});save()}else render();function setChar(id){selected=id;for(const key of ['suzune','io']){$(key).classList.toggle('active',key===id);$(key).setAttribute('aria-pressed',String(key===id))}$('status').textContent='当前角色：'+(id==='suzune'?'铃音':'伊绪')+' · 演示回复模式'}$('suzune').onclick=()=>setChar('suzune');$('io').onclick=()=>setChar('io');const replies={suzune:['哥哥，我在这里！这是第一版演示，下一步我们会接入真正的 AI 对话。','好呀！我们先把手机上的语音功能测试好，再给铃音换上动态形象。','听到哥哥说话我很开心！不过现在我的回答还是预设的演示台词哦。'],io:['目前系统处于演示模式，尚未连接语言模型。','建议下一步加入安全的后端 API，再实现真正的双角色对话。','语音播放依赖手机内置的中文语音包，不同设备的效果可能不同。']};let count=0;function speak(text,character){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=character==='suzune'?1.08:.94;u.pitch=character==='suzune'?1.25:.85;window.speechSynthesis.speak(u)}$('form').onsubmit=e=>{e.preventDefault();const v=$('input').value.trim();if(!v)return;history.push({who:'me',text:v});const character=selected,answer=replies[character][count++%replies[character].length];history.push({who:character,text:answer});$('input').value='';save();speak(answer,character)};$('clear').onclick=()=>{if(confirm('清空此设备保存的演示聊天记录？')){history=[];save()}};const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;$('mic').onclick=()=>{if(!SpeechRecognition){alert('当前浏览器不支持语音识别。请使用 Chrome 或手动输入。');return}const r=new SpeechRecognition();r.lang='zh-CN';r.interimResults=false;r.onresult=e=>{$('input').value=e.results[0][0].transcript};r.onerror=e=>alert('语音识别未完成：'+e.error);r.start()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
